name: Build Xiaomi Surya Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - "16.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            flex \
            libncurses-dev \
            libncurses5-dev \
            libncursesw5-dev \
            fakeroot \
            rsync \
            kmod \
            xz-utils \
            lz4 \
            openssl \
            python3 \
            device-tree-compiler \
            pahole \
            dialog \
            bash \
            sed \
            wget \
            git \
            curl \
            zip \
            tar \
            jq \
            expect \
            make \
            cmake \
            automake \
            autoconf \
            binutils \
            apt-utils \
            perl \
            gperf \
            gawk \
            bc \
            zstd \
            unzip \
            cpio \
            bison \
            build-essential \
            ccache \
            liblz4-tool \
            libsdl1.2-dev \
            libstdc++6 \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            xsltproc \
            zlib1g-dev \
            bzip2 \
            libssl-dev \
            dwarves \
            libelf-dev \
            dos2unix \
            python-is-python3 \
            gh \
            git-lfs \
            nano

      - name: Initialize Git submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Download toolchain from MediaFire
        run: |
          mediafire_auto_download() {
            local URL="$1"
            local DEST_DIR="$2"
            local real_url
            local chrome_bin="${CHROME_BIN:-chromium}"
            local domex

            if [[ -z "$URL" ]]; then
              echo "No MediaFire URL provided."
              return 1
            fi

            mkdir -p "$DEST_DIR"

            echo "Trying static scrape..."

            real_url=$(curl -sL \
              -A "Mozilla/5.0" \
              "$URL" |
              grep -Eo 'https://download[^"'\'' ]+' |
              head -n 1 || true)

            if [[ -n "$real_url" ]]; then
              echo "Found direct download URL."
              echo "Downloading toolchain..."

              curl -L \
                -A "Mozilla/5.0" \
                -e "$URL" \
                -o "$DEST_DIR/toolchain.zip" \
                "$real_url"

              return $?
            fi

            echo "Static scrape failed."
            echo "Trying headless Chromium render..."

            if ! command -v "$chrome_bin" >/dev/null 2>&1; then
              echo "Chromium not found."
              echo "Unable to resolve the MediaFire download URL."
              return 2
            fi

            domex=$(mktemp)

            "$chrome_bin" \
              --headless \
              --disable-gpu \
              --dump-dom \
              --no-first-run \
              --no-default-browser-check \
              --no-sandbox \
              "$URL" > "$domex" 2>/dev/null || {
                echo "Chromium render failed."
                rm -f "$domex"
                return 3
              }

            real_url=$(grep -Eo \
              'https://download[^"'\'' ]+' \
              "$domex" |
              head -n 1 || true)

            rm -f "$domex"

            if [[ -z "$real_url" ]]; then
              echo "Could not find a direct MediaFire download URL."
              return 4
            fi

            echo "Found direct download URL."
            echo "Downloading toolchain..."

            curl -L \
              -A "Mozilla/5.0" \
              -e "$URL" \
              -o "$DEST_DIR/toolchain.zip" \
              "$real_url"
          }

          mediafire_auto_download \
            "https://www.mediafire.com/file/nye07pqvologena/toolchain.zip/file" \
            "$GITHUB_WORKSPACE"

          test -f "$GITHUB_WORKSPACE/toolchain.zip"

          ls -lh "$GITHUB_WORKSPACE/toolchain.zip"

      - name: Extract toolchain
        run: |
          unzip -q toolchain.zip

      - name: Build kernel
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh -j 4

      - name: List build artifacts
        if: always()
        run: |
          echo "Build output:"
          find out -type f 2>/dev/null | sort || true

          echo ""
          echo "Distribution output:"
          find dist -type f 2>/dev/null | sort || true

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: surya-kernel
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surya-kernel-build-log
          path: out/build.log
          if-no-files-found: warn
          retention-days: 7
